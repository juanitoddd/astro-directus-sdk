# nginx config for the static site produced by `npm run build:static`.
# Mount the site root at /usr/share/nginx/html (e.g. bind `web/dist/client` from
# the host into the container) and this file at /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Redirects ----------
    # These mirror the redirects in astro.config.mjs. In pure static output the
    # adapter doesn't handle them, so encode them at the edge as proper 302s.
    location = / {
        return 302 /en;
    }
    location = /en/home {
        return 302 /en;
    }
    location = /de/home {
        return 302 /de;
    }

    # ---------- Cache policy ----------
    # Astro emits fingerprinted assets under /_astro/<name>.<hash>.{js,css,…}.
    # Safe to cache for a year and mark immutable.
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static assets (favicons, images shipped in /public, fonts, etc.):
    # short cache so editors don't need a hard refresh after replacing one.
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff2?|ttf|otf|eot)$ {
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # HTML responds with no-cache so editors see new content immediately after
    # an atomic swap. Browsers still revalidate; cache servers can use ETag.
    location / {
        add_header Cache-Control "no-cache";
        # Astro emits per-route directories: /en/about/index.html, etc.
        try_files $uri $uri/ $uri.html $uri/index.html /404.html;
    }

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---------- 404 fallback ----------
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
